<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c"><title>Renders</title>
<link rel="stylesheet" href="/app/ui/forge.css"><script src="/app/ui/forge.js"></script>
<style>
.ghead{display:flex;align-items:flex-end;gap:10px;margin:24px 4px 10px}
.ghead .t{font-size:17px;font-weight:700;letter-spacing:-.01em}
.search{width:100%;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--fg);font-size:15px;outline:none;
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);margin-bottom:10px}
.search:focus{border-color:rgba(205,184,143,.5)}
</style>
</head><body>

<div class="row" style="margin:4px 2px 12px">
  <div class="grow"><div class="tiny mut" id="sum">Library</div><h1 style="margin:2px 0 0">Renders</h1></div>
</div>
<div class="seg" id="src" style="margin-bottom:10px"><button class="on" data-s="all">All</button><button data-s="colab">Colab · 5B</button><button data-s="thunder">Thunder · 14B</button></div>
<input class="search" id="q" placeholder="Search packs and chains" autocomplete="off">
<div class="chips" id="chips"></div>
<div id="groups"><div class="thumb skel" style="margin-top:20px"></div></div>

<script>
const {$, esc} = F;
const KINDS = [['all', 'All'], ['pack', 'Packs'], ['chain', 'Chains'], ['keeper', 'Keepers'], ['test', 'Tests']];
let lib = [], kind = 'all', src = localStorage.getItem('renders_src') || 'all', open = new Set();
const inSrc = g => src === 'all' || (g.source || 'colab') === src;

function chips(){
  const n = k => lib.filter(g => inSrc(g) && (k === 'all' || g.kind === k)).length;
  $('chips').innerHTML = KINDS.filter(([k]) => n(k)).map(([k, l]) =>
    `<button class="chip${k === kind ? ' on' : ''}" data-k="${k}">${l} <span class="dim">${n(k)}</span></button>`).join('');
}
$('chips').addEventListener('click', e => { const k = e.target.closest('[data-k]')?.dataset.k; if (k){ kind = k; render(); } });
$('q').addEventListener('input', render);
const segSync = () => document.querySelectorAll('#src button').forEach(b => b.classList.toggle('on', b.dataset.s === src));
$('src').addEventListener('click', e => { const s = e.target.closest('[data-s]')?.dataset.s; if (!s) return; src = s; localStorage.setItem('renders_src', s); kind = 'all'; segSync(); render(); });
segSync();

function render(){
  chips();
  const q = $('q').value.trim().toLowerCase();
  const gs = lib.filter(g => inSrc(g) && (kind === 'all' || g.kind === kind) && (!q || g.title.toLowerCase().includes(q)));
  $('groups').innerHTML = gs.length ? gs.map(g => {
    const full = open.has(g.id);
    const clips = full ? g.clips : g.clips.slice(-12).reverse();
    const label = c => c.idx ? 'Clip ' + c.idx : '';
    return `<section data-g="${esc(g.id)}">
      <div class="ghead"><div class="grow"><div class="t trunc">${esc(g.title)}</div>
        <div class="tiny mut">${src === 'all' ? (g.source === 'thunder' ? 'Thunder 14B · ' : 'Colab 5B · ') : ''}${g.count} clip${g.count === 1 ? '' : 's'} · updated ${F.ago(g.updated)}</div></div>
        <button class="btn sm" data-play>▶ Play</button></div>
      <div class="${full ? 'grid' : 'strip'}">${clips.map(c => F.thumb(c, label(c))).join('')}</div>
      ${g.count > 12 ? `<div style="text-align:center;margin-top:6px"><button class="btn ghost sm" data-more>${full ? 'Show less' : 'Show all ' + g.count}</button></div>` : ''}
    </section>`;
  }).join('') : '<div class="empty">Nothing matches.</div>';
}

$('groups').addEventListener('click', e => {
  const sec = e.target.closest('section'); if (!sec) return;
  const g = lib.find(x => x.id === sec.dataset.g);
  const title = c => g.title + (c.idx ? ' · clip ' + c.idx : '');
  if (e.target.closest('[data-more]')){ open.has(g.id) ? open.delete(g.id) : open.add(g.id); render(); return; }
  if (e.target.closest('[data-play]')){ F.viewer(g.clips, 0, title); return; }
  const n = e.target.closest('.thumb')?.dataset.clip;
  if (n) F.viewer(g.clips, g.clips.findIndex(c => c.name === n), title);
});

async function load(){
  try {
    const next = await F.api('/api/media/library');
    const sig = JSON.stringify(next.map(g => [g.id, g.count, g.updated]));
    if (sig === load.sig) return;
    load.sig = sig; lib = next;
    const total = lib.reduce((a, g) => a + g.count, 0);
    $('sum').textContent = `${total} clips · ${lib.length} collections`;
    render();
  } catch (e) { F.toast('Load failed: ' + e.message); }
}
F.pull(() => { load.sig = null; return load(); });
load(); setInterval(() => { if (!document.hidden && !document.querySelector('.viewer')) load(); }, 60000);
</script>
</body></html>
