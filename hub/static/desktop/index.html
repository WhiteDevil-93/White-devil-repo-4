<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Hub</title>
<meta name="theme-color" content="#0a0b0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/app/desktop/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/app/desktop/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/app/desktop/icon-192.png">
<style>
:root{--bg:#0a0b0f;--side:#0f1117;--fg:#eceef5;--mut:#a9afc2;--dim:#9097ad;--strong:#eceef5;--acc:#8f82ff;
  --line:#232838;--hover:rgba(255,255,255,.04);--on:rgba(91,75,232,.16);--ok:#3fbf8a;--warn:#e5a23a;--bad:#f0645a;
  --acc2:#5b4be8;--panel:#141722;--well:#0c0e14;--ink:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font:13px/1.4 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);grid-template-rows:52px minmax(0,1fr) 28px;height:100%}
.titlebar{grid-column:1/-1;display:flex;align-items:center;gap:12px;height:52px;padding:0 12px 0 16px;
  background:var(--side);border-bottom:1px solid var(--line);flex:none}
.word{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--strong);flex:none}
.word .mark{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  background:var(--acc2)}
.word img{width:14px;height:14px}
.proj{font-size:13px;color:var(--mut);padding:4px 8px;border-radius:6px;border:1px solid transparent}
.proj b{color:var(--strong);font-weight:600}
.dot-unsaved{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.grow{flex:1;min-width:0}
.seg{display:flex;background:var(--well);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:none;color:var(--mut);padding:5px 14px;border-radius:999px;
  font:600 12px inherit;cursor:pointer}
.seg button.on{background:var(--acc2);color:#fff}
.titlebar .ai{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;
  height:30px;padding:0 12px;font:600 12px inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.titlebar .ai:hover{border-color:var(--acc2);color:var(--strong)}
.titlebar button.icon{appearance:none;background:transparent;border:1px solid transparent;color:var(--mut);border-radius:6px;
  height:30px;min-width:30px;padding:0 8px;cursor:pointer;display:grid;place-items:center}
.titlebar button.icon:hover{background:var(--hover);color:var(--fg)}
.titlebar button.text{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;
  height:30px;padding:0 12px;font:600 12px inherit;cursor:pointer}
.titlebar button.gold{background:var(--acc2);color:#fff;border-color:transparent}
.titlebar svg{width:14px;height:14px}
.clock{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px}
aside{grid-row:2;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
nav{flex:1;overflow:auto;padding:12px 10px}
.sec{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:16px 8px 8px}
nav .sec:first-child{margin-top:4px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:8px;color:var(--mut);text-decoration:none;
  font-weight:500;font-size:13px;cursor:pointer;user-select:none;position:relative;min-height:44px}
nav a:hover{background:var(--hover);color:var(--fg)}
nav a.on{background:var(--on);color:var(--strong)}
nav a.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:99px;
  background:var(--acc2)}
nav a svg{width:16px;height:16px;flex:none;opacity:.8;color:var(--dim)}
nav a.on svg{opacity:1;color:var(--acc)}
nav a .meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
nav a .name{display:block}
nav a .sum{display:block;font-size:11px;color:var(--dim);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav a .k{margin-left:auto;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;align-self:flex-start}
.ready{margin:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02);flex:none}
.ready .hd{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:8px}
.ready .hd b{color:var(--strong);letter-spacing:0;text-transform:none;font-size:13px}
.ready .row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-top:5px}
.ready .st{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.ready .st.ok{background:var(--ok)}.ready .st.bad{background:var(--bad)}.ready .st.warn{background:var(--warn)}
main{grid-row:2;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.frames{position:relative;flex:1;min-height:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);visibility:hidden}
.frames iframe.on{visibility:visible}
.load{position:absolute;left:0;top:0;height:2px;background:var(--acc2);width:0;opacity:0;transition:width .6s,opacity .3s;z-index:3}
.load.go{width:70%;opacity:1}
.err{padding:60px;color:var(--dim);text-align:center}
.jobs{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--side);
  border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.jobs .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.jobs .dot.ok{background:var(--ok)}.jobs .dot.warn{background:var(--warn)}.jobs .dot.bad{background:var(--bad)}
.jobs .right{margin-left:auto;display:flex;gap:16px}
html.app #pop{display:none}
@media (max-width:1180px){
  .shell{grid-template-columns:72px minmax(0,1fr)}
  .proj,.seg,.clock,nav a .name,nav a .sum,nav a .k,.sec,.ready .txt,.ready .hd span:first-child,.jobs .right{display:none}
  nav a{justify-content:center;padding:10px}
  .word span{display:none}
}
</style>
</head>
<body>
<div class="shell">
  <div class="titlebar">
    <div class="word"><span class="mark"><img src="/app/desktop/icon.svg" alt=""></span><span>Forge Hub</span></div>
    <div class="proj"><b id="title">Forge Hub</b> · <span>local session</span></div>
    <span class="dot-unsaved" id="unsaved" hidden title="Update Hub pending"></span>
    <span class="grow"></span>
    <div class="seg" role="tablist">
      <button type="button" class="on" id="modeHub">Hub</button>
      <button type="button" id="modeVenice">Agent</button>
    </div>
    <button type="button" class="ai" id="aiAssist" title="Venice Agent (Ctrl+Shift+V)">AI Assist</button>
    <span class="clock" id="clock"></span>
    <button type="button" class="icon" id="reload" title="Reload screen (Ctrl+R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
    <button type="button" class="text gold" id="updateHub" title="Publish this Hub to wan-relay">Update Hub</button>
    <button type="button" class="icon" id="pop" title="Open in a browser tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
  </div>
  <aside>
    <nav id="nav"></nav>
    <div class="ready" id="foot">
      <div class="hd"><span>Readiness</span><b id="readyN">—</b></div>
      <div class="txt">
        <div class="row"><span class="st" id="stRelay"></span><span>Relay</span></div>
        <div class="row"><span class="st" id="stLap"></span><span>Laptop</span></div>
        <div class="row"><span class="st" id="stClip"></span><span>Newest clip</span></div>
        <div class="row"><span class="st" id="stRun"></span><span>Runner</span></div>
      </div>
    </div>
  </aside>
  <main>
    <div class="frames" id="frames"><div class="load" id="load"></div></div>
  </main>
  <div class="jobs" id="jobs">
    <span class="dot" id="jobDot"></span>
    <span id="jobMsg">Connecting…</span>
    <span class="right" id="jobRight"></span>
  </div>
</div>
<script>
const ICONS = {
  home: 'M10,20v-6h4v6h5v-8h3L12,3 2,12h3v8z',
  movie: 'M18,4l2,4h-3l-2,-4h-2l2,4h-3l-2,-4H8l2,4H7L5,4H4c-1.1,0 -1.99,0.9 -1.99,2L2,18c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V4h-4z',
  cloud: 'M19.35,10.04C18.67,6.59 15.64,4 12,4 9.11,4 6.6,5.64 5.35,8.04 2.34,8.36 0,10.91 0,14c0,3.31 2.69,6 6,6h13c2.76,0 5,-2.24 5,-5 0,-2.64 -2.05,-4.78 -4.65,-4.96z',
  bolt: 'M13,2L4,14h6.5L9.5,22 20,9.5h-6.6z',
  folder: 'M10,4H4c-1.1,0 -1.99,0.9 -1.99,2L2,18c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V8c0,-1.1 -0.9,-2 -2,-2h-8l-2,-2z',
  terminal: 'M20,4H4C2.89,4 2,4.9 2,6v12c0,1.1 0.89,2 2,2h16c1.1,0 2,-0.9 2,-2V6C22,4.9 21.11,4 20,4zM20,18H4V8h16V18zM18,17h-6v-2h6V17zM7.5,17l-1.41,-1.41L8.67,13l-2.59,-2.59L7.5,9l4,4L7.5,17z',
  ltx: 'M4,4h16v4H4zM4,10h7v10H4zM13,10h7v10h-7z',
  setup: 'M19.4,13c.04-.32.1-.65.1-1s-.06-.68-.1-1l2.1-1.6-2-3.5-2.5,1c-.53-.4-1.1-.73-1.7-.97L15,2h-4l-.3,2.93c-.6.24-1.17.57-1.7.97l-2.5-1-2,3.5L6.6,10c-.04.32-.1.65-.1,1s.06.68.1,1L4.5,13.6l2,3.5 2.5-1c.53.4,1.1.73,1.7.97L11,22h4l.3-2.93c.6-.24,1.17-.57,1.7-.97l2.5,1 2-3.5-2.1-1.6zM13,15a3,3 0 1 1,0-6 3,3 0 0 1,0 6z',
  vast: 'M12,2L3,7v10l9,5 9-5V7z',
  gallery: 'M22,16V4c0-1.1-.9-2-2-2H8c-1.1,0-2,.9-2,2v12c0,1.1.9,2,2,2h12c1.1,0,2-.9,2-2zM11,9l2.03,2.71L16,8.5l4,5.5H8l3-4.5zM2,6v14c0,1.1.9,2,2,2h14v-2H4V6H2z',
  pen: 'M3,17.25V21h3.75L17.81,9.94l-3.75,-3.75L3,17.25zM20.71,7.04c0.39,-0.39 0.39,-1.02 0,-1.41l-2.34,-2.34c-0.39,-0.39 -1.02,-0.39 -1.41,0l-1.83,1.83 3.75,3.75 1.83,-1.83z',
  bot: 'M12,2a2,2 0 0 1 2,2c0,.74 -.4,1.39 -1,1.73V7h1a7,7 0 0 1 7,7h1v3h-1v1a2,2 0 0 1 -2,2H5a2,2 0 0 1 -2,-2v-1H2v-3h1a7,7 0 0 1 7,-7h1V5.73C10.4,5.39 10,4.74 10,4a2,2 0 0 1 2,-2zM8.5,13a1.5,1.5 0 1 0 0,3 1.5,1.5 0 0 0 0,-3zM15.5,13a1.5,1.5 0 1 0 0,3 1.5,1.5 0 0 0 0,-3z',
  venice: 'M12,2l1.8,5.4L19,9l-4,3.2L16.2,18 12,15.2 7.8,18 9,12.2 5,9l5.2,-1.6L12,2zM19,13.2l.9,2.6L22,16.5 20,18.1 20.6,21 19,19.6 17.4,21 18,18.1 16,16.5 18.1,15.8z',
};
const SPIRAL = 'M12,12m-1.5,0a1.5,1.5 0,1 1,3 0a3,3 0,1 1,-6 0a4.5,4.5 0,1 1,9 0a6,6 0,1 1,-12 0a7.5,7.5 0,1 1,15 0';
const ALIAS = {renders: 'movie', gallery: 'gallery', hypno: 'spiral', spiral: 'spiral', thunder: 'bolt', colab: 'cloud', files: 'folder', term: 'terminal', shell: 'terminal', venice: 'venice', chat: 'venice', ltx: 'ltx', setup: 'setup', vast: 'vast'};
function icon(name) {
  const n = ALIAS[name] || name;
  if (n === 'spiral') return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="${SPIRAL}"/></svg>`;
  return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="${ICONS[n] || ICONS.bot}"/></svg>`;
}
const EXTRA = [
  {id: 'gen-colab', title: 'Colab 5B', icon: 'pen', url: '/generator.html?target=colab', group: 'Prompt creator'},
  {id: 'gen-thunder', title: 'Thunder 14B', icon: 'pen', url: '/generator.html?target=thunder', group: 'Prompt creator'},
];
const $ = id => document.getElementById(id);
let screens = [], current = null;
const frames = {};
let lastSt = {}, lastColab = {};

function groupOf(s) {
  if (s.group) return s.group === 'bots' ? 'Bots' : s.group;
  return s.url.startsWith('/laptop/') ? 'Laptop' : 'Studio';
}

function buildNav() {
  const nav = $('nav'); nav.innerHTML = '';
  let last = null, n = 0;
  for (const s of screens) {
    const g = groupOf(s);
    if (g !== last) { nav.insertAdjacentHTML('beforeend', `<div class="sec">${g}</div>`); last = g; }
    n++;
    const a = document.createElement('a');
    a.dataset.id = s.id; a.href = '#' + s.id;
    a.innerHTML = `${icon(s.icon)}<span class="meta"><span class="name">${s.title}</span><span class="sum" data-sum="${s.id}"></span></span>${n <= 9 ? `<span class="k">Ctrl ${n}</span>` : ''}`;
    a.onclick = e => { e.preventDefault(); show(s.id); };
    nav.appendChild(a);
  }
}

function setSum(id, text) {
  const el = document.querySelector(`[data-sum="${id}"]`);
  if (el) el.textContent = text || '';
}

function screenForUrl(href) {
  let u; try { u = new URL(href, location.href); } catch { return null; }
  if (u.origin !== location.origin) return null;
  const path = u.pathname + u.search;
  return screens.find(s => s.url === path || (s.url.endsWith('/') && u.pathname.replace(/\/?$/, '/') === s.url.replace(/\/?$/, '/')));
}

function hookFrame(f) {
  f.addEventListener('load', () => {
    $('load').classList.remove('go');
    try {
      const d = f.contentDocument;
      d.addEventListener('click', e => {
        const a = e.target.closest && e.target.closest('a[href]');
        if (!a || a.target === '_blank' || e.ctrlKey || e.metaKey) return;
        const href = a.getAttribute('href');
        const s = screenForUrl(href);
        if (s && s.id !== f.dataset.id) { e.preventDefault(); show(s.id, false, href); }
      }, true);
      d.addEventListener('keydown', keys);
    } catch (e) {}
  });
}

function makeFrame(s, src) {
  const f = document.createElement('iframe');
  f.dataset.id = s.id;
  f.allow = s.id === 'term'
    ? 'fullscreen; autoplay'
    : 'fullscreen; clipboard-read; clipboard-write; autoplay';
  hookFrame(f);
  f.src = src || s.url;
  $('frames').appendChild(f);
  return f;
}

function ensureFrame(id) {
  const s = screens.find(x => x.id === id);
  if (!s) return null;
  if (!frames[s.id]) {
    frames[s.id] = makeFrame(s, s.url);
    $('load').classList.add('go');
  }
  return frames[s.id];
}

function pasteIntoTerm(text) {
  const raw = String(text || '');
  if (!raw) return false;
  const f = frames.term;
  if (!f || !f.contentWindow) return false;
  try {
    const w = f.contentWindow;
    if (typeof w.ForgeTermReceive === 'function') {
      w.ForgeTermReceive(raw);
      return true;
    }
    w.postMessage({type: 'forge:term-paste', text: raw}, '*');
    return true;
  } catch (e) {
    return false;
  }
}

window.ForgeDesktopTermPaste = function (text, opts) {
  const raw = String(text || '');
  if (!raw) return Promise.resolve(false);
  const showShell = !!(opts && opts.show);
  const f = ensureFrame('term');
  if (!f) return Promise.resolve(false);
  if (showShell) show('term');
  const tryPaste = () => pasteIntoTerm(raw);
  if (tryPaste()) return Promise.resolve(true);
  return new Promise(resolve => {
    const done = () => resolve(tryPaste());
    f.addEventListener('load', () => setTimeout(done, 350), {once: true});
    setTimeout(done, 1600);
  });
};

window.addEventListener('message', ev => {
  const d = ev.data;
  if (!d || d === 'forge:shown') return;
  if (d.type === 'forge:term-paste' && d.text) {
    window.ForgeDesktopTermPaste(d.text, {show: !!d.show});
  }
});

function show(id, reload, href) {
  if (id === 'agent') id = 'venice'; // ltx/index.html calls parent.show('agent', ...)
  const s = screens.find(x => x.id === id) || screens[0];
  if (!s) return;
  current = s;
  const src = href || s.url;
  let f = frames[s.id];
  if (!f) {
    f = frames[s.id] = makeFrame(s, src); $('load').classList.add('go');
  } else if (reload || href) {
    $('load').classList.add('go');
    if (href) {
      const u = new URL(src, location.href);
      u.searchParams.set('_t', String(Date.now()));
      f.src = u.pathname + u.search;
    } else {
      f.contentWindow.location.reload();
    }
  }
  for (const [k, el] of Object.entries(frames)) {
    const isTarget = k === s.id;
    el.classList.toggle('on', isTarget);
    try {
      if (isTarget && el.contentWindow) {
        el.contentWindow.postMessage('forge:shown', '*');
      }
    } catch (e) {}
  }
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.id === s.id));
  $('title').textContent = s.title;
  document.title = s.title + ' · Forge Hub';
  $('modeHub').classList.toggle('on', s.id !== 'venice');
  $('modeVenice').classList.toggle('on', s.id === 'venice');
  if (location.hash !== '#' + s.id) history.replaceState(null, '', '#' + s.id);
  localStorage.setItem('desk_screen', s.id);
}

function keys(e) {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'V' || e.key === 'v')) { e.preventDefault(); show('venice'); return; }
  if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
  if (/^[1-9]$/.test(e.key) && screens[+e.key - 1]) { e.preventDefault(); show(screens[+e.key - 1].id); }
  else if (e.key === 'r' && current) { e.preventDefault(); show(current.id, true); }
}

function tickClock() {
  const el = $('clock');
  if (!el) return;
  const d = new Date();
  const day = new Intl.DateTimeFormat(undefined, {weekday: 'short', month: 'short', day: 'numeric'}).format(d);
  const tm = new Intl.DateTimeFormat(undefined, {hour: '2-digit', minute: '2-digit', hour12: false}).format(d);
  el.textContent = day + ' · ' + tm;
}

function mark(el, kind) { if (el) el.className = 'st ' + (kind || ''); }

async function status() {
  if (document.hidden) return;
  tickClock();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const [st, colab] = await Promise.all([
      fetch('/api/status', {cache: 'no-store', signal: controller.signal}).then(r => r.json()),
      fetch('/api/colab/state', {cache: 'no-store', signal: controller.signal}).then(r => r.json()).catch(() => ({}))
    ]);
    lastSt = st; lastColab = colab;
    const age = st.newest_age_min;
    const lapOn = !!(st.laptop && st.laptop.online);
    const clipOk = age != null && age < 45;
    const alerts = (st.alerts || []).length;
    const job = (colab.jobs || []).find(j => j.status === 'rendering');
    const runner = !!(colab.runner_online || (colab.usage && colab.usage.active > 0));
    mark($('stRelay'), alerts ? 'bad' : 'ok');
    mark($('stLap'), lapOn ? 'ok' : 'bad');
    mark($('stClip'), clipOk ? 'ok' : (age == null ? 'warn' : 'bad'));
    mark($('stRun'), colab.paused ? 'warn' : runner ? 'ok' : 'bad');
    const bits = [!alerts, lapOn, clipOk, !colab.paused && runner];
    const n = bits.filter(Boolean).length;
    $('readyN').textContent = n + '/4';
    $('unsaved').hidden = true;
    setSum('home', job ? 'Rendering' : runner ? 'Idle' : 'Runner off');
    setSum('renders', st.clips != null ? st.clips + ' clips' : '');
    setSum('term', 'ttyd shell');
    setSum('venice', 'Agent + tools');
    setSum('colab', runner ? 'G4 on' : 'Off');
    const jdot = $('jobDot');
    if (job) { jdot.className = 'dot warn'; $('jobMsg').textContent = 'Rendering · ' + (job.name || 'job'); }
    else if (colab.paused) { jdot.className = 'dot warn'; $('jobMsg').textContent = 'Paused · auto-restart off'; }
    else if (runner) { jdot.className = 'dot ok'; $('jobMsg').textContent = 'No active render · Idle'; }
    else { jdot.className = 'dot'; $('jobMsg').textContent = 'No active render · Runner offline'; }
    const free = st.laptop && st.laptop.free_gb;
    $('jobRight').textContent = (st.clips != null ? st.clips + ' clips' : '') + (free != null ? ' · ' + Math.round(free) + ' GB free' : '');
  } catch (e) {
    mark($('stRelay'), 'bad');
    mark($('stLap'), 'bad');
    mark($('stClip'), 'bad');
    mark($('stRun'), 'bad');
    $('readyN').textContent = '0/4';
    $('jobDot').className = 'dot bad';
    $('jobMsg').textContent = 'Relay unreachable';
  } finally {
    clearTimeout(timer);
  }
}

async function boot() {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const m = await (await fetch('/api/manifest', {cache: 'no-store', signal: controller.signal})).json();
    const main = m.screens.filter(s => s.group !== 'bots');
    const pc = main.filter(s => s.group === 'Prompt creator');
    screens = [...main.filter(s => s.group !== 'Prompt creator'), ...EXTRA, ...pc, ...m.screens.filter(s => s.group === 'bots')];
    // The manifest calls the Agent screen 'agent'; this shell (and the Electron app that loads it) knows it as 'venice'.
    screens = screens.map(s => s.id === 'agent' ? {...s, id: 'venice'} : s);
    localStorage.setItem('desk_manifest', JSON.stringify(screens));
  } catch (e) {
    screens = JSON.parse(localStorage.getItem('desk_manifest') || '[]');
    if (!screens.length) { $('frames').innerHTML = '<div class="err">Relay unreachable. Check your connection and reload.</div>'; return; }
  } finally {
    clearTimeout(timer);
  }
  buildNav();
  show(location.hash.slice(1) || localStorage.getItem('desk_screen') || screens[0].id);
  tickClock();
  status(); setInterval(status, 60000); setInterval(tickClock, 30000);
}

document.addEventListener('keydown', keys);
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (!current || id !== current.id) show(id); });
$('reload').onclick = () => current && show(current.id, true);
$('updateHub').onclick = () => show('term', false, '/app/term/?update=1');
$('pop').onclick = () => { const f = current && frames[current.id]; window.open(f ? f.contentWindow.location.href : current.url, '_blank'); };
$('aiAssist').onclick = () => show('venice');
$('modeVenice').onclick = () => show('venice');
$('modeHub').onclick = () => show(current && current.id !== 'venice' ? current.id : 'home');
boot();
</script>
</body>
