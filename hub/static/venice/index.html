<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Venice Agent</title>
<link rel="stylesheet" href="/app/ui/forge.css">
<script src="/app/ui/forge.js"></script>
<style>
html,body{height:100%;height:100dvh;margin:0;padding:0;overflow:hidden;background:#0b0b0c}
.shell{display:flex;flex-direction:column;height:100%;min-height:0}
.head{flex:none;padding:14px 16px 10px;background:linear-gradient(#141416,rgba(11,11,12,.92))}
.brand{font-size:18px;font-weight:700;letter-spacing:-.03em;color:#f4f1ea}
.brand span{color:var(--mut);font-weight:500;font-size:13px;margin-left:8px}
.status{text-align:right}
.log{flex:1;min-height:0;overflow:auto;padding:10px 16px 16px;-webkit-overflow-scrolling:touch}
.msg{max-width:92%;margin:0 0 10px;padding:11px 13px;border-radius:16px;line-height:1.45;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.msg.user{margin-left:auto;background:rgba(205,184,143,.16);border:1px solid rgba(205,184,143,.38);border-bottom-right-radius:6px}
.msg.assistant,.msg.venice{background:var(--glass);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.err,.msg.error{border-color:rgba(217,147,147,.45);background:rgba(68,33,33,.35);color:var(--bad)}
.msg.laptop{border-color:rgba(147,187,163,.35);background:rgba(147,187,163,.08)}
.msg.tool_call{max-width:100%;margin-left:12px;margin-right:12px;background:rgba(31,46,61,.55);border:1px solid #5c8bb5;border-radius:12px;font:12px/1.4 ui-monospace,monospace;color:#c5dcf0}
.msg.tool,.msg.tool_output{max-width:100%;margin-left:12px;margin-right:12px;background:rgba(29,29,36,.7);border:1px solid var(--line);border-radius:12px;font:12px/1.4 ui-monospace,monospace;color:var(--mut)}
.msg .acts{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.msg .who-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.msg .who{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.msg.user .who{color:var(--acc)}
.msg.assistant .who,.msg.venice .who{color:var(--strong)}
.msg.tool_call .who{color:#82b6e8}
.msg.tool .who,.msg.tool_output .who{color:var(--mut)}
.msg.laptop .who{color:var(--ok)}
.msg.error .who,.msg.err .who{color:#ff6b6b}
.msg .copy{appearance:none;border:0;background:rgba(205,184,143,.12);color:var(--acc);font:700 11px system-ui;
  letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;min-height:32px;border-radius:999px;flex:none}
.msg .copy:active{transform:scale(.96)}
.msg .copy[disabled]{opacity:.35}
.empty{padding:36px 10px 18px;text-align:center}
.empty h2{font-size:22px;letter-spacing:-.03em;text-transform:none;color:#f4f1ea;margin:0 0 10px;font-weight:700}
.composer{flex:none;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#121110}
.composer textarea{min-height:48px;max-height:140px;resize:none}
.controls{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.controls input[type=range]{flex:1;min-width:80px;accent-color:var(--acc)}
.keystrip{flex:none;padding:10px 12px 12px;background:#161412;border-bottom:1px solid var(--line)}
.keystrip label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.keystrip input{width:100%;font:15px ui-monospace,monospace;padding:12px;border-radius:12px;border:1px solid rgba(205,184,143,.35);
  background:#0b0b0c;color:#ededea}
.btn.gold,.btn.primary{background:var(--strong);color:#111;border-color:transparent;font-weight:700}
.thread{font-size:12px;color:var(--mut);margin-top:4px;max-width:58vw}
.prog{height:3px;background:transparent;flex:none}
.prog i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--acc2),var(--acc3));animation:slide 1.1s infinite}
.prog.off{visibility:hidden}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
.drawer{position:absolute;inset:0;z-index:6;background:rgba(0,0,0,.55);display:none}
.drawer.on{display:block}
.drawer .panel{position:absolute;inset:0;background:#121110;display:flex;flex-direction:column;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.drawer h2{font-size:22px;letter-spacing:-.03em;text-transform:none;color:#f4f1ea;margin:0;font-weight:700}
.chatlist{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;margin-top:12px}
.chatrow{display:flex;gap:10px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.chatrow:first-child{border-top:0}
.chatrow .grow{min-width:0}
.chatrow .t{font-weight:650;color:#f4f1ea}
.chatrow.on .t{color:var(--acc)}
.toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);user-select:none}
.toggle input{accent-color:var(--acc)}
.head .row{flex-wrap:wrap;gap:8px}
#model{max-width:160px}
@media (max-width:640px){#model{max-width:120px}}
</style>
</head>
<body>
<div class="shell">
  <div class="head">
    <div class="row">
      <div class="grow">
        <div class="brand">Venice Agent<span>tools + Shell</span></div>
        <div class="thread trunc" id="threadTitle">New chat</div>
      </div>
      <div class="status">
        <div class="pill bad" id="st">Need key</div>
        <div class="tiny mut" id="base">https://api.venice.ai/api/v1</div>
      </div>
    </div>
    <div class="row wrap" style="margin-top:10px">
      <select class="input" id="model"></select>
      <button class="btn sm" id="openPrompt">Prompt</button>
      <button class="btn sm" id="newChat">Clear</button>
      <button class="btn sm" id="openChats">Chats</button>
      <button class="btn sm" id="openShell">Shell</button>
    </div>
  </div>

  <div class="keystrip" id="keystrip">
    <label for="key">Venice API key</label>
    <input id="key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="VENICE_…  (venice.ai → Settings → API)">
    <div class="row wrap" style="margin-top:8px">
      <button class="btn gold grow" id="saveRelay">Save on relay</button>
      <button class="btn grow" id="savePhone">Save on this device</button>
    </div>
    <div class="tiny mut" id="keyHint" style="margin-top:8px">Same key the Android Agent uses. Do not paste it in chat.</div>
  </div>

  <div class="prog off" id="prog"><i></i></div>
  <div class="log" id="log"></div>

  <div class="composer">
    <div class="controls">
      <span class="tiny mut">temp</span>
      <input type="range" id="temp" min="0" max="1.5" step="0.05" value="0.7">
      <span class="tiny" id="tempv">0.70</span>
      <label class="toggle" title="After a laptop command, also print it in the live Shell"><input type="checkbox" id="toTerm" checked> Show in Shell</label>
      <label class="toggle"><input type="checkbox" id="webSearch"> Web</label>
      <button class="btn sm" id="copyLast">Copy</button>
      <button class="btn sm" id="stop" disabled>Stop</button>
    </div>
    <div class="row" style="margin-top:8px;align-items:flex-end">
      <textarea class="input grow" id="idea" rows="2" placeholder="Ask Venice or give a task…"></textarea>
      <button class="btn gold send" id="go" style="height:44px">Send</button>
    </div>
  </div>

  <div class="drawer" id="promptSheet">
    <div class="panel">
      <div class="row">
        <h2 class="grow">System prompt</h2>
        <button class="btn sm" id="promptDefault">Default</button>
        <button class="btn sm gold" id="closePrompt">Save</button>
      </div>
      <textarea class="input" id="sys" spellcheck="false" style="flex:1;min-height:180px;margin-top:12px"></textarea>
    </div>
  </div>
  <div class="drawer" id="drawer">
    <div class="panel">
      <div class="row">
        <h2 class="grow">Chats</h2>
        <button class="btn sm" id="drawerNew">New</button>
        <button class="btn sm gold" id="closeChats">Done</button>
      </div>
      <div class="tiny mut" style="margin-top:8px">Chats save on this device and on the relay.</div>
      <div class="chatlist" id="chatList"></div>
    </div>
  </div>
</div>
<script>
const {$, esc} = F;
const LS_KEY = 'venice.deviceKey';
const LS_MODEL = 'venice.model';
const LS_CHAT = 'venice.chat';
const LS_SYS = 'venice.systemPrompt';
const LS_TERM = 'venice.showInShell';
const DEFAULT_SYS = "You are WhiteDevil Venice Agent, an autonomous AI assistant with tools to inspect and modify local workspace files, and monitor and trigger remote Forge Hub and Wan2.2 video generation pipelines on the relay and laptop. Be concise and proactive. Use run_laptop_command for scripts that need stdout. Use run_in_terminal to type a command into the live laptop Shell (ttyd) so the user can watch it.";
const MAX_ITERS = 8;
let messages = [];
let history = [];
let tools = [];
let busy = false;
let configured = false;
let abort = null;

function headers() {
  const h = {};
  const k = localStorage.getItem(LS_KEY);
  if (k) h['X-Venice-Key'] = k;
  return h;
}
function setStatus(text, kind) {
  $('st').textContent = text;
  $('st').className = 'pill ' + (kind || '');
}
function setBusy(on) {
  busy = on;
  $('go').disabled = on;
  $('stop').disabled = !on;
  $('prog').classList.toggle('off', !on);
}
async function copyText(text) {
  const t = String(text || '');
  if (!t.trim()) { F.toast('Nothing to copy yet'); return false; }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(t);
      F.toast('Copied');
      return true;
    }
  } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = t;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, t.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  F.toast(ok ? 'Copied' : 'Copy failed — long-press the message');
  return ok;
}
function flashCopy(btn, ok) {
  if (!btn || !ok) return;
  const prev = btn.textContent;
  btn.textContent = 'Copied';
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = prev; }, 1200);
}
function lastVeniceText() {
  const bodies = [...document.querySelectorAll('.msg.assistant .body, .msg.venice .body')];
  for (let i = bodies.length - 1; i >= 0; i--) {
    const t = bodies[i].textContent || '';
    if (t.trim()) return t;
  }
  const m = [...messages].reverse().find(x => (x.role === 'assistant' || x.role === 'venice') && x.content);
  return (m && m.content) || '';
}
function extractCommand(text) {
  const src = String(text || '');
  const fences = [...src.matchAll(/```([^\n`]*)\n([\s\S]*?)```/g)];
  if (fences.length) return fences[fences.length - 1][2].replace(/\s+$/, '');
  return src.replace(/\s+$/, '');
}
async function sendToTerm(text, opts) {
  const raw = String(text || '');
  if (!raw.trim()) return false;
  const run = !opts || opts.run !== false;
  const payload = {type: 'forge:term-paste', text: run && !raw.endsWith('\n') ? raw + '\n' : raw, show: !!(opts && opts.show)};
  try {
    if (parent !== window && typeof parent.ForgeDesktopTermPaste === 'function') {
      await parent.ForgeDesktopTermPaste(payload.text, {show: payload.show});
      return true;
    }
  } catch (e) {}
  try {
    if (parent !== window) {
      parent.postMessage(payload, '*');
      return true;
    }
  } catch (e) {}
  return false;
}
function termTranscript(cmd, output, exit) {
  const lines = String(cmd || '').split('\n').map(l => '# ' + l);
  return [
    '',
    '# ── venice agent ── exit ' + (exit == null ? '?' : exit),
    ...lines,
    "cat <<'VENICE_OUT'",
    String(output || '(no output)').replace(/\s+$/, '').slice(0, 8000),
    'VENICE_OUT',
    ''
  ].join('\n');
}
function whoOf(role, name) {
  if (role === 'user') return 'You';
  if (role === 'laptop') return 'Laptop';
  if (role === 'tool_call') return 'Tool Call' + (name ? ': ' + name : '');
  if (role === 'tool' || role === 'tool_output') return 'Output' + (name ? ': ' + name : '');
  if (role === 'error' || role === 'err') return 'Error';
  return 'Venice';
}
function bubble(role, text, extra, name) {
  const el = document.createElement('div');
  el.className = 'msg ' + role + (extra ? ' ' + extra : '');
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text || '';
  if (role !== 'system') {
    const row = document.createElement('div');
    row.className = 'who-row';
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = whoOf(role, name);
    const acts = document.createElement('div');
    acts.className = 'acts';
    const canRun = role === 'assistant' || role === 'venice' || role === 'tool_call' || role === 'laptop';
    if (canRun) {
      const run = document.createElement('button');
      run.type = 'button';
      run.className = 'copy';
      run.textContent = 'Shell';
      run.setAttribute('aria-label', 'Send to Shell');
      run.disabled = !String(text || '').trim();
      run.onclick = async ev => {
        ev.preventDefault(); ev.stopPropagation();
        const cmd = extractCommand(body.textContent);
        const ok = await sendToTerm(cmd, {run: true, show: true});
        F.toast(ok ? 'Sent to Shell' : 'Shell is not open in this window');
      };
      acts.appendChild(run);
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy';
    btn.textContent = 'Copy';
    btn.setAttribute('aria-label', 'Copy message');
    btn.disabled = !String(text || '').trim();
    btn.onclick = async ev => {
      ev.preventDefault();
      ev.stopPropagation();
      flashCopy(btn, await copyText(body.textContent));
    };
    acts.appendChild(btn);
    row.append(who, acts);
    el.appendChild(row);
  }
  el.appendChild(body);
  $('log').appendChild(el);
  $('log').scrollTop = $('log').scrollHeight;
  return body;
}
function empty() {
  $('log').innerHTML = `<div class="empty">
    <h2>Venice Agent</h2>
    <div class="mut small">Same agent as the phone app: it can read workspace files, check renders, download LoRAs, run laptop commands, and type into the live Shell terminal.</div>
  </div>`;
}

const LS_THREADS = 'venice.threads';
let store = {activeId: null, chats: []};
let persistTimer = 0;

function nid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function titleOf(msgs) {
  const u = (msgs || []).find(m => m.role === 'user' && m.content);
  const t = String(u && u.content || '').replace(/\s+/g, ' ').trim();
  return t.slice(0, 48) || 'New chat';
}
function readLocalStore() {
  try {
    const raw = JSON.parse(localStorage.getItem(LS_THREADS) || 'null');
    if (raw && Array.isArray(raw.chats)) return raw;
  } catch (e) {}
  try {
    const legacy = JSON.parse(localStorage.getItem(LS_CHAT) || '[]');
    if (Array.isArray(legacy) && legacy.length) {
      const id = nid();
      return {activeId: id, chats: [{id, title: titleOf(legacy), updated: Date.now(), model: '', system: '', messages: legacy}]};
    }
  } catch (e) {}
  return {activeId: null, chats: []};
}
function writeLocalStore() {
  try { localStorage.setItem(LS_THREADS, JSON.stringify(store)); } catch (e) {}
  try { localStorage.setItem(LS_CHAT, JSON.stringify(messages.slice(-80))); } catch (e) {}
}
function mergeStores(a, b) {
  const map = {};
  for (const s of [a, b]) for (const c of (s && s.chats) || []) {
    if (!c || !c.id) continue;
    const prev = map[c.id];
    if (!prev || (c.updated || 0) >= (prev.updated || 0)) map[c.id] = c;
  }
  const chats = Object.values(map).sort((x, y) => (y.updated || 0) - (x.updated || 0));
  const active = (b && b.activeId && map[b.activeId] && b) ? b.activeId : ((a && a.activeId && map[a.activeId]) ? a.activeId : (chats[0] && chats[0].id) || null);
  return {activeId: active, chats};
}
function currentSnap() {
  if (!messages.length) return null;
  const id = store.activeId || nid();
  store.activeId = id;
  return {
    id,
    title: titleOf(messages),
    updated: Date.now(),
    model: $('model').value,
    system: $('sys').value,
    messages: messages.slice(-80)
  };
}
function putCurrent() {
  const snap = currentSnap();
  if (!snap) return;
  store.chats = [snap].concat(store.chats.filter(c => c.id !== snap.id)).slice(0, 40);
  store.activeId = snap.id;
}
function showThread() {
  const t = store.chats.find(c => c.id === store.activeId);
  $('threadTitle').textContent = t ? t.title : (messages.length ? titleOf(messages) : 'New chat');
}
function uiRole(m) {
  if (m.role === 'tool_output') return 'tool';
  if (m.role === 'venice') return 'assistant';
  if (m.role === 'err') return 'error';
  return m.role;
}
function historyFromUi(msgs) {
  const out = [];
  const sys = ($('sys').value || '').trim() || DEFAULT_SYS;
  if (sys) out.push({role: 'system', content: sys});
  for (const m of msgs || []) {
    const role = uiRole(m);
    if (role === 'user') out.push({role: 'user', content: m.content});
    else if (role === 'assistant') {
      const msg = {role: 'assistant', content: m.content || null};
      if (m.tool_calls) msg.tool_calls = m.tool_calls;
      out.push(msg);
    } else if (role === 'tool') {
      out.push({role: 'tool', content: m.content, tool_call_id: m.tool_call_id, name: m.name});
    } else if (role === 'laptop') {
      out.push({role: 'user', content: 'Laptop ran the last snippet.\n' + m.content});
    }
  }
  return out;
}
function renderLog() {
  if (!messages.length) { empty(); showThread(); return; }
  $('log').innerHTML = '';
  for (const m of messages) {
    if (m.role === 'system') continue;
    bubble(uiRole(m), m.content, '', m.name);
  }
  $('log').scrollTop = $('log').scrollHeight;
  showThread();
}
function openChat(id) {
  putCurrent();
  const t = store.chats.find(c => c.id === id);
  if (!t) return;
  store.activeId = id;
  messages = (t.messages || []).map(m => Object.assign({}, m));
  history = historyFromUi(messages);
  if (t.model && [...$('model').options].some(o => o.value === t.model)) $('model').value = t.model;
  if (t.system != null && t.system !== '') $('sys').value = t.system;
  renderLog();
  persist(true);
  F.toast('Resumed');
}
function newChat() {
  putCurrent();
  store.activeId = null;
  messages = [];
  history = historyFromUi([]);
  renderLog();
  persist(true);
  $('drawer').classList.remove('on');
  $('idea').focus();
}
function deleteChat(id) {
  store.chats = store.chats.filter(c => c.id !== id);
  if (store.activeId === id) {
    const next = store.chats[0];
    store.activeId = next ? next.id : null;
    messages = next ? (next.messages || []).map(m => Object.assign({}, m)) : [];
    history = historyFromUi(messages);
    if (next && next.system != null && next.system !== '') $('sys').value = next.system;
    renderLog();
  }
  persist(true);
  drawChatList();
}
function drawChatList() {
  const list = $('chatList');
  const rows = store.chats;
  if (!rows.length) {
    list.innerHTML = `<div class="empty"><div class="mut">No saved chats yet. Send a message and it stays here.</div></div>`;
    return;
  }
  list.innerHTML = rows.map(c => {
    const n = (c.messages || []).length;
    const when = F.ago((c.updated || 0) / 1000);
    const on = c.id === store.activeId ? ' on' : '';
    return `<div class="chatrow${on}" data-id="${esc(c.id)}">
      <div class="grow" data-open="${esc(c.id)}">
        <div class="t trunc">${esc(c.title || 'Chat')}</div>
        <div class="tiny mut">${esc(when)} · ${n} message${n === 1 ? '' : 's'}</div>
      </div>
      <button class="btn sm ghost del" data-del="${esc(c.id)}">Delete</button>
    </div>`;
  }).join('');
}
function persist(now) {
  putCurrent();
  showThread();
  writeLocalStore();
  const send = () => F.api('/api/venice/chats', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(store)}).catch(() => {});
  if (now) send();
  else {
    clearTimeout(persistTimer);
    persistTimer = setTimeout(send, 250);
  }
}
function pushUi(role, content, extra) {
  const rec = Object.assign({role, content}, extra || {});
  messages.push(rec);
  if (!$('log').querySelector('.msg')) $('log').innerHTML = '';
  bubble(uiRole(rec), content, rec.role === 'error' ? 'err' : '', rec.name);
  persist();
}

$('temp').oninput = () => { $('tempv').textContent = Number($('temp').value).toFixed(2); };
$('copyLast').onclick = async () => {
  const btns = document.querySelectorAll('.msg.assistant .copy, .msg.venice .copy');
  flashCopy(btns[btns.length - 1], await copyText(lastVeniceText()));
};
$('newChat').onclick = newChat;
$('drawerNew').onclick = newChat;
$('openChats').onclick = () => { putCurrent(); drawChatList(); $('drawer').classList.add('on'); };
$('closeChats').onclick = () => $('drawer').classList.remove('on');
$('openPrompt').onclick = () => $('promptSheet').classList.add('on');
$('closePrompt').onclick = () => {
  localStorage.setItem(LS_SYS, $('sys').value);
  $('promptSheet').classList.remove('on');
  persist(true);
};
$('promptDefault').onclick = () => { $('sys').value = DEFAULT_SYS; };
$('openShell').onclick = async () => {
  const ok = await sendToTerm('# venice · Shell', {run: true, show: true});
  if (!ok) location.href = '/app/term/';
};
$('chatList').onclick = ev => {
  const del = ev.target.closest('[data-del]');
  if (del) { ev.preventDefault(); deleteChat(del.dataset.del); return; }
  const open = ev.target.closest('[data-open]');
  if (open) { $('drawer').classList.remove('on'); openChat(open.dataset.open); }
};
$('stop').onclick = () => { if (abort) abort.abort(); };
$('toTerm').onchange = () => localStorage.setItem(LS_TERM, $('toTerm').checked ? '1' : '0');

async function saveRelay() {
  const v = $('key').value.trim();
  if (!v) { $('key').focus(); F.toast('Paste the key first'); return; }
  try {
    const j = await F.post('/api/venice/key', {key: v});
    localStorage.removeItem(LS_KEY);
    $('key').value = '';
    $('key').placeholder = 'Saved on relay · paste a new one to replace';
    setStatus('Ready', 'ok');
    configured = true;
    $('keyHint').textContent = 'Saved at ' + (j.where || '~/.venice_key') + '.';
    F.toast('Key saved on the relay');
  } catch (e) { setStatus('key rejected', 'bad'); F.toast(e.message || String(e)); }
}
function savePhone() {
  const v = $('key').value.trim();
  if (!v) { localStorage.removeItem(LS_KEY); F.toast('Device key cleared'); return; }
  localStorage.setItem(LS_KEY, v);
  configured = true;
  setStatus('Ready', 'ok');
  F.toast('Key saved on this device only');
}
$('saveRelay').onclick = saveRelay;
$('savePhone').onclick = savePhone;
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveRelay(); } });

function parseToolResult(output) {
  const text = String(output || '');
  try {
    const j = JSON.parse(text);
    if (j && typeof j === 'object') return j;
  } catch (e) {}
  return null;
}
async function execTool(call) {
  const name = (call.function && call.function.name) || call.name || '';
  let args = {};
  const rawArgs = (call.function && call.function.arguments) || call.arguments || '{}';
  try { args = typeof rawArgs === 'string' ? JSON.parse(rawArgs || '{}') : (rawArgs || {}); } catch (e) { args = {}; }
  if (name === 'run_in_terminal') {
    const cmd = String(args.command || args.code || '').trim();
    if (!cmd) return "Error: 'command' argument is required.";
    const ok = await sendToTerm(cmd, {run: true, show: true});
    if (ok) return 'Command sent to the live Shell terminal. Watch the Shell tab for output.';
    const fallback = await F.post('/api/venice/tool', {name: 'run_laptop_command', arguments: {code: cmd, lang: 'bash'}}, {timeout: 120000});
    return (fallback && fallback.output) || 'Shell unavailable; laptop SSH also failed.';
  }
  const j = await F.post('/api/venice/tool', {name, arguments: args}, {timeout: 120000});
  const output = (j && j.output) != null ? String(j.output) : JSON.stringify(j);
  if (name === 'run_laptop_command' && $('toTerm').checked) {
    const parsed = parseToolResult(output);
    const cmd = String(args.code || args.command || '');
    const shown = parsed && parsed.output != null ? parsed.output : output;
    await sendToTerm(termTranscript(cmd, shown, parsed && parsed.exit), {run: true, show: false});
  }
  return output;
}

async function boot() {
  let st = {configured: false, default_model: 'zai-org-glm-5-2', base: 'https://api.venice.ai/api/v1'};
  try { st = await F.api('/api/venice/status'); } catch (e) {}
  configured = !!st.configured || !!localStorage.getItem(LS_KEY);
  if (st.base) $('base').textContent = st.base;
  setStatus(configured ? 'Ready' : 'Need key', configured ? 'ok' : 'warn');
  if (st.configured) {
    $('key').placeholder = 'Relay already has a key · paste a new one here to replace it';
    $('keyHint').textContent = 'Relay file: ' + (st.key_file || '~/.venice_key');
  }
  const savedSys = localStorage.getItem(LS_SYS);
  $('sys').value = savedSys || st.default_system_prompt || DEFAULT_SYS;
  if (localStorage.getItem(LS_TERM) === '0') $('toTerm').checked = false;

  try {
    const t = await F.api('/api/venice/tools');
    tools = t.tools || [];
  } catch (e) { tools = []; }

  let models = [];
  try {
    const r = await fetch('/api/venice/models', {headers: headers(), credentials: 'same-origin'});
    models = (await r.json()).models || [];
  } catch (e) {}
  if (!models.length) models = [{id: 'zai-org-glm-5-2', name: 'GLM 5.2'}, {id: 'venice-uncensored', name: 'Venice Uncensored'}];
  const prefer = localStorage.getItem(LS_MODEL) || st.default_model || 'zai-org-glm-5-2';
  $('model').innerHTML = models.map(m => `<option value="${esc(m.id)}">${esc(m.name || m.id)}</option>`).join('');
  if ([...$('model').options].some(o => o.value === prefer)) $('model').value = prefer;
  $('model').onchange = () => localStorage.setItem(LS_MODEL, $('model').value);

  store = readLocalStore();
  try {
    const remote = await F.api('/api/venice/chats');
    store = mergeStores(store, remote);
  } catch (e) {}
  writeLocalStore();
  const active = store.activeId && store.chats.find(c => c.id === store.activeId);
  if (active) {
    messages = (active.messages || []).map(m => Object.assign({}, m));
    if (active.model && [...$('model').options].some(o => o.value === active.model)) $('model').value = active.model;
    if (active.system) $('sys').value = active.system;
  } else {
    store.activeId = null;
    messages = [];
  }
  history = historyFromUi(messages);
  renderLog();
}

async function send() {
  const text = $('idea').value.trim();
  if (!text || busy) return;
  if (/^VENICE[_-]/i.test(text) || /ADMIN_KEY/i.test(text)) {
    $('key').value = text;
    $('idea').value = '';
    $('key').focus();
    F.toast('That looks like a key — it is in the key box now. Tap Save on relay.');
    return;
  }
  if (!configured && !localStorage.getItem(LS_KEY) && !$('key').value.trim()) {
    $('key').focus();
    F.toast('Paste the Venice API key at the top first');
    return;
  }
  $('idea').value = '';
  pushUi('user', text);
  history.push({role: 'user', content: text});
  setBusy(true);
  abort = new AbortController();
  setStatus('Thinking', 'warn');
  try {
    for (let i = 0; i < MAX_ITERS; i++) {
      const r = await fetch('/api/venice/chat', {
        method: 'POST', credentials: 'same-origin', signal: abort.signal,
        headers: Object.assign({'Content-Type': 'application/json'}, headers()),
        body: JSON.stringify({
          model: $('model').value,
          stream: false,
          temperature: Number($('temp').value),
          web_search: $('webSearch').checked,
          venice_prompt: false,
          messages: history,
          tools: tools.length ? tools : undefined,
        })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status));
      const choice = j.choices && j.choices[0];
      const msg = choice && choice.message;
      if (!msg) throw new Error('Venice API returned no choices.');
      history.push(msg);
      const calls = msg.tool_calls || [];
      if (!calls.length) {
        const reply = msg.content || '';
        if (!reply.trim()) throw new Error('Empty reply');
        pushUi('assistant', reply);
        setStatus('Ready', 'ok');
        configured = true;
        persist(true);
        return;
      }
      if (msg.content && String(msg.content).trim()) pushUi('assistant', msg.content);
      for (const call of calls) {
        const fname = (call.function && call.function.name) || 'tool';
        const fargs = (call.function && call.function.arguments) || '';
        pushUi('tool_call', fargs, {name: fname});
        const result = await execTool(call);
        pushUi('tool', result, {name: fname, tool_call_id: call.id});
        history.push({role: 'tool', content: result, tool_call_id: call.id, name: fname});
      }
    }
    pushUi('error', 'Reached maximum tool iterations (' + MAX_ITERS + ').');
    setStatus('Ready', 'ok');
  } catch (e) {
    if (e.name === 'AbortError') {
      pushUi('error', 'Stopped');
    } else {
      const err = e.message || String(e);
      pushUi('error', err);
      if (/401/.test(err)) setStatus('key rejected (401)', 'bad');
      else setStatus('Error', 'bad');
    }
    persist(true);
  } finally {
    setBusy(false);
    abort = null;
  }
}
$('go').onclick = send;
$('idea').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
boot();
</script>
