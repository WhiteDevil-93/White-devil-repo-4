<!-- screen_requirements:
- Deep Space AI palette: #0B0E14 (bg), #151921 (surface), #7C3AED (accent), #C084FC (light accent).
- Stark Grid layout: Geometric, clean lines, high-contrast text and minimalist profile header.
- Font: Plus Jakarta Sans.
- Header: Profile image with status glow and technical tier label.
- Sections: Settings items as grid-aligned blocks with subtle hover/active states.
- Footer: Technical versioning and system health indicator.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - WhiteDevil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'space-bg': '#0B0E14',
                        'space-surface': '#151921',
                        'space-accent': '#7C3AED',
                        'space-glow': '#C084FC',
                        'space-border': '#1F2937',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0B0E14;
            color: #FFFFFF;
            -webkit-font-smoothing: antialiased;
        }
        .stark-grid {
            background-image: 
                linear-gradient(to right, rgba(31, 41, 55, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(31, 41, 55, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .profile-glow {
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.15);
        }
    </style>
</head>
<body class="max-w-[375px] mx-auto h-[812px] flex flex-col relative overflow-hidden">
    <!-- Stark Grid Background -->
    <div class="fixed inset-0 stark-grid pointer-events-none opacity-40"></div>

    <!-- Header / Profile Summary -->
    <header class="relative z-10 px-8 pt-16 pb-12 border-b border-space-border">
        <div class="flex flex-col items-center gap-6">
            <div class="relative">
                <div class="w-24 h-24 rounded-full overflow-hidden border-2 border-space-accent profile-glow">
                    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" alt="User Avatar" class="w-full h-full object-cover">
                </div>
                <div class="absolute bottom-1 right-1 w-5 h-5 bg-space-bg border-2 border-space-bg rounded-full flex items-center justify-center">
                    <div class="w-3 h-3 bg-green-500 rounded-full shadow-[0_0_8px_#22c55e]"></div>
                </div>
            </div>
            <div class="text-center">
                <h1 class="text-2xl font-bold tracking-tight mb-1">User_7294</h1>
                <div class="inline-flex items-center gap-2 px-3 py-1 bg-space-surface border border-space-border rounded-sm">
                    <span class="text-[10px] font-mono text-space-glow uppercase tracking-widest font-bold">Developer Tier</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Settings List -->
    <main class="flex-1 overflow-y-auto relative z-10">
        <div class="divide-y divide-space-border border-b border-space-border">
            <!-- Account Settings -->
            <a href="#" class="flex items-center justify-between p-6 hover:bg-space-surface transition-colors active:bg-space-surface">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-space-surface border border-space-border flex items-center justify-center text-white/40">
                        <i class="fa-solid fa-gear"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-semibold">General Settings</h3>
                        <p class="text-[10px] text-white/40 uppercase tracking-wider">UI, Language, Regions</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-white/20"></i>
            </a>

            <!-- Terminal / Dev Tools -->
            <a href="#" class="flex items-center justify-between p-6 hover:bg-space-surface transition-colors active:bg-space-surface">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-space-surface border border-space-border flex items-center justify-center text-white/40">
                        <i class="fa-solid fa-terminal"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-semibold">System Console</h3>
                        <p class="text-[10px] text-white/40 uppercase tracking-wider">Log analysis & CLI</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-white/20"></i>
            </a>

            <!-- Security Node -->
            <a href="#" class="flex items-center justify-between p-6 hover:bg-space-surface transition-colors active:bg-space-surface">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-space-surface border border-space-border flex items-center justify-center text-white/40">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-semibold">Security Protocol</h3>
                        <p class="text-[10px] text-green-500/60 uppercase tracking-wider">All nodes active</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-white/20"></i>
            </a>

            <!-- Documentation -->
            <a href="#" class="flex items-center justify-between p-6 hover:bg-space-surface transition-colors active:bg-space-surface">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-space-surface border border-space-border flex items-center justify-center text-white/40">
                        <i class="fa-solid fa-book-code"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-semibold">WhiteDevil Docs</h3>
                        <p class="text-[10px] text-white/40 uppercase tracking-wider">API & SDK reference</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-white/20"></i>
            </a>
        </div>

        <div class="p-8 text-center">
            <p class="text-[10px] font-mono text-white/20 uppercase tracking-[0.2em]">Version 1.0.4 • Build 92</p>
            <p class="text-[10px] font-mono text-white/10 uppercase tracking-widest mt-2 italic">Forge Protocol Activated</p>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav id="footer" class="relative w-full h-[72px] bg-space-bg border-t border-space-border grid grid-cols-3 z-30">
        <a href="AgentChat__mobile.html" class="flex flex-col items-center justify-center gap-1 group">
            <i class="fa-solid fa-bolt text-lg text-white/40 group-hover:text-space-accent transition-colors"></i>
            <span class="text-[9px] font-bold uppercase tracking-tighter text-white/40 group-hover:text-white transition-colors">Agent</span>
        </a>
        <a href="ForgeHub__mobile.html" class="flex flex-col items-center justify-center gap-1 group">
            <i class="fa-solid fa-layer-group text-lg text-white/40 group-hover:text-space-accent transition-colors"></i>
            <span class="text-[9px] font-bold uppercase tracking-tighter text-white/40 group-hover:text-white transition-colors">Hub</span>
        </a>
        <a href="YouProfile__mobile.html" class="flex flex-col items-center justify-center gap-1 group relative">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-[2px] bg-space-accent shadow-[0_0_10px_rgba(124,58,237,1)]"></div>
            <i class="fa-solid fa-user text-lg text-space-accent"></i>
            <span class="text-[9px] font-bold uppercase tracking-tighter text-white">You</span>
        </a>
    </nav>
</body>
</html>
